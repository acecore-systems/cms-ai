name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repositoryをcheckout
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: 依存関係を再現
        run: npm ci

      - name: Worker binding型を生成
        run: npm run types

      - name: TypeScriptを検査
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: formatを検査
        run: npm run format:check

      - name: Worker bundleを検査
        run: npm run deploy:dry-run
